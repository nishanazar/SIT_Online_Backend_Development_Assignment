<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fetch API CRUD Practice</title>

    <link rel="stylesheet" href="Q1_crud.css">
</head>
<body>

    <h1>Fetch API CRUD Practice</h1>

    <h3>GET | POST | PUT | PATCH | DELETE</h3>

    <!-- Add Post Form -->
    <div class="form-container">

        <h2>Add New Post</h2>

        <form id="postForm">

            <label>Post Title:</label>
            <input type="text" id="title" required>

            <label>User ID:</label>
            <input type="number" id="userId" required>

            <label>Post Content:</label>
            <textarea id="body" required></textarea>

            <button type="submit">Add Post</button>

        </form>

        <button id="reloadBtn">Reload Posts</button>

        <p id="message"></p>

    </div>

    <!-- Posts will display here -->
    <h2>All Posts</h2>

    <div id="postsContainer">
        Loading posts...
    </div>

    <script src="Q1_crud.js"></script>

</body>
</html>
